name: Api Test Framework Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options: [qa,uat,dev]
        default: qa
        required: true

      suiteXmlFile:
        description: "testNG XML file"
        type: choice
        options: [testNG.xml,sanity.xml,regression.xml,smoke.xml]
        default: testNG.xml
        required: true
    
jobs:
  RunTest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Default value for execution
      id: default
      run: |
            echo "suiteXmlFile=${{ github.event.inputs.suiteXmlFile || 'testNG.xml' }}" >> GITHUB_OUTPUT
            echo "env=${{ github.event.inputs.env || 'qa' }}" >> GITHUB_OUTPUT
            
    - name: Execute API test framework
      run: mvn clean test -DsuiteXmlFile="${{ steps.default.outputs.suiteXmlFile }}" -Denv="${{ steps.default.outputs.env }}"

    - name: Upload a Build Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Surfire Report
        path: target/surefire-reports/
        retention-days: 10
